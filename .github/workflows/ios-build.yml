name: Build FoodCheck iOS

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-26-intel

    steps:
      # --------------------------------------------------
      # 1. Scarica il repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v5

      # --------------------------------------------------
      # 2. Controlla ambiente macOS / Xcode
      # --------------------------------------------------
      - name: Show macOS and Xcode
        run: |
          echo "macOS:"
          sw_vers

          echo ""
          echo "Xcode:"
          xcodebuild -version

      # --------------------------------------------------
      # 3. Node.js
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # --------------------------------------------------
      # 4. Installa dipendenze JavaScript
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          npm ci --legacy-peer-deps

      # --------------------------------------------------
      # 5. Genera il progetto iOS
      # --------------------------------------------------
      - name: Generate iOS native project
        run: |
          npx expo prebuild \
            --platform ios \
            --non-interactive

      # --------------------------------------------------
      # 6. Installa CocoaPods
      # --------------------------------------------------
      - name: Install CocoaPods
        working-directory: ios
        run: |
          pod install

      # --------------------------------------------------
      # 7. Mostra la struttura iOS
      # --------------------------------------------------
      - name: Inspect iOS project
        working-directory: ios
        run: |
          echo "Files:"
          ls -la

          echo ""
          echo "Workspace:"
          ls -la *.xcworkspace

          echo ""
          echo "Available schemes:"
          xcodebuild \
            -list \
            -workspace FoodCheck.xcworkspace

      # --------------------------------------------------
      # 8. Compila l'app iOS
      #
      # IMPORTANTE:
      # niente archive.
      # Generiamo direttamente FoodCheck.app
      # --------------------------------------------------
      - name: Build unsigned iOS app
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/build"

          mkdir -p "$GITHUB_WORKSPACE/build"

          xcodebuild \
            -workspace "$GITHUB_WORKSPACE/ios/FoodCheck.xcworkspace" \
            -scheme "FoodCheck" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      # --------------------------------------------------
      # 9. Cerca FoodCheck.app
      # --------------------------------------------------
      - name: Locate built .app
        shell: bash
        run: |
          set -e

          echo "Searching for .app..."

          find "$GITHUB_WORKSPACE/build/DerivedData" \
            -type d \
            -name "*.app" \
            -print

          APP_PATH=$(find \
            "$GITHUB_WORKSPACE/build/DerivedData" \
            -type d \
            -name "FoodCheck.app" \
            | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo ""
            echo "ERROR: FoodCheck.app was not found."
            echo ""
            echo "All generated .app files:"
            find "$GITHUB_WORKSPACE/build/DerivedData" \
              -type d \
              -name "*.app" \
              -print

            exit 1
          fi

          echo ""
          echo "FoodCheck.app found:"
          echo "$APP_PATH"

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 10. Crea IPA unsigned
      # --------------------------------------------------
      - name: Create unsigned IPA
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/ipa"

          mkdir -p "$GITHUB_WORKSPACE/ipa/Payload"

          echo "Copying:"
          echo "$APP_PATH"

          cp -R "$APP_PATH" \
            "$GITHUB_WORKSPACE/ipa/Payload/FoodCheck.app"

          cd "$GITHUB_WORKSPACE/ipa"

          zip -qry \
            "$GITHUB_WORKSPACE/FoodCheck-unsigned.ipa" \
            Payload

          echo ""
          echo "IPA created:"
          ls -lh "$GITHUB_WORKSPACE/FoodCheck-unsigned.ipa"

      # --------------------------------------------------
      # 11. Controlla IPA
      # --------------------------------------------------
      - name: Verify IPA
        shell: bash
        run: |
          set -e

          test -f "$GITHUB_WORKSPACE/FoodCheck-unsigned.ipa"

          echo "IPA:"
          ls -lh "$GITHUB_WORKSPACE/FoodCheck-unsigned.ipa"

          echo ""
          echo "IPA contents:"
          unzip -l "$GITHUB_WORKSPACE/FoodCheck-unsigned.ipa" | head -50

      # --------------------------------------------------
      # 12. Carica IPA su GitHub
      # --------------------------------------------------
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: FoodCheck-iOS
          path: FoodCheck-unsigned.ipa
          if-no-files-found: error
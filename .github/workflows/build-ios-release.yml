name: FoodCheck iOS Release

on:
  workflow_dispatch:

jobs:
  build-ios-release:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # expo-dev-client is needed for the development build,
      # but it must not be part of the standalone release binary.
      - name: Remove development client for release
        run: npm uninstall expo-dev-client --no-save --legacy-peer-deps

      - name: Generate clean iOS native project
        run: npx expo prebuild --platform ios --non-interactive --clean

      - name: Install CocoaPods
        working-directory: ios
        run: pod install --repo-update

      # Explicitly create the production JS bundle so the app
      # never needs Metro / a development server.
      - name: Embed production JavaScript bundle
        run: npx expo export:embed --platform ios --dev false

      - name: Build iOS Release (unsigned)
        working-directory: ios
        env:
          SKIP_BUNDLING: ""
          FORCE_BUNDLING: "1"
        run: |
          set -e

          echo "Building Release with embedded JavaScript bundle..."

          xcodebuild \
            -workspace FoodCheck.xcworkspace \
            -scheme FoodCheck \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SKIP_BUNDLING="" \
            FORCE_BUNDLING=1

      - name: Verify JavaScript bundle is inside the app
        run: |
          set -e

          APP_PATH="$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "ERRORE: FoodCheck.app non trovata."
            exit 1
          fi

          if [ ! -f "$APP_PATH/main.jsbundle" ]; then
            echo "ERRORE: main.jsbundle NON è presente dentro FoodCheck.app"
            echo "La build non è standalone."
            exit 1
          fi

          echo "OK: main.jsbundle presente:"
          ls -lh "$APP_PATH/main.jsbundle"

      - name: Package IPA
        run: |
          set -e

          APP_PATH="$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"

          rm -rf Payload
          mkdir Payload

          cp -R "$APP_PATH" Payload/

          rm -f FoodCheck-release-unsigned.ipa
          cd Payload
          zip -qry ../FoodCheck-release-unsigned.ipa "$(basename "$APP_PATH")"
          cd ..

          rm -rf Payload

          echo "IPA creata:"
          ls -lh FoodCheck-release-unsigned.ipa

      - name: Upload standalone IPA
        uses: actions/upload-artifact@v4
        with:
          name: FoodCheck-iOS-Standalone
          path: FoodCheck-release-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

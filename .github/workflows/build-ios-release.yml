name: FoodCheck iOS Release

on:
  workflow_dispatch:

jobs:
  build-ios-release:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Keep expo-dev-client installed for Expo/React Native tooling,
      # but remove only its config plugin from this Release build.
      # The repository files are not changed by this CI modification.
      - name: Prepare standalone Expo config
        run: |
          node <<'NODE'
          const fs = require('fs');

          const path = 'app.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));

          const expo = config.expo ?? {};

          if (Array.isArray(expo.plugins)) {
            expo.plugins = expo.plugins.filter((plugin) => {
              if (typeof plugin === 'string') {
                return plugin !== 'expo-dev-client';
              }

              if (Array.isArray(plugin)) {
                return plugin[0] !== 'expo-dev-client';
              }

              return true;
            });
          }

          config.expo = expo;
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');

          console.log('Standalone config prepared.');
          console.log(JSON.stringify(config.expo.plugins ?? [], null, 2));
          NODE

      - name: Generate clean iOS native project
        env:
          CI: "1"
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        working-directory: ios
        run: pod install --repo-update

      # Explicitly embed the production JavaScript bundle.
      - name: Embed production JavaScript bundle
        run: npx expo export:embed --platform ios --dev false

      - name: Build iOS Release (unsigned)
        working-directory: ios
        run: |
          set -e

          xcodebuild \
            -workspace FoodCheck.xcworkspace \
            -scheme FoodCheck \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SKIP_BUNDLING=NO

      - name: Verify standalone bundle
        run: |
          set -e

          APP_PATH="$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "ERRORE: FoodCheck.app non trovata."
            exit 1
          fi

          echo "App trovata: $APP_PATH"

          if [ ! -f "$APP_PATH/main.jsbundle" ]; then
            echo "ERRORE: main.jsbundle non presente."
            echo "La build non è standalone."
            exit 1
          fi

          echo "OK: JavaScript bundle incorporato."
          ls -lh "$APP_PATH/main.jsbundle"

          if [ -d "$APP_PATH/PlugIns" ]; then
            echo "PlugIns presenti:"
            find "$APP_PATH/PlugIns" -maxdepth 2 -type f -name '*.appex' -print || true
          fi

      - name: Package IPA
        run: |
          set -e

          APP_PATH="$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"

          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/

          rm -f FoodCheck-release-unsigned.ipa

          cd Payload
          zip -qry ../FoodCheck-release-unsigned.ipa "$(basename "$APP_PATH")"
          cd ..

          rm -rf Payload

          echo "IPA creata:"
          ls -lh FoodCheck-release-unsigned.ipa

      - name: Upload standalone IPA
        uses: actions/upload-artifact@v4
        with:
          name: FoodCheck-iOS-Standalone
          path: FoodCheck-release-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

name: Build FoodCheck iOS Development

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-26-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Show macOS and Xcode
        run: |
          echo "macOS:"
          sw_vers

          echo ""
          echo "Xcode:"
          xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --legacy-peer-deps

      - name: Generate iOS native project
        run: |
          npx expo prebuild \
            --platform ios \
            --non-interactive \
            --clean

      - name: Install CocoaPods
        working-directory: ios
        run: |
          pod install

      - name: Inspect iOS project
        working-directory: ios
        run: |
          echo "Workspace:"
          ls -la *.xcworkspace

          echo ""
          echo "Schemes:"
          xcodebuild \
            -list \
            -workspace FoodCheck.xcworkspace

      - name: Build development iOS app
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/build"

          mkdir -p "$GITHUB_WORKSPACE/build"

          xcodebuild \
            -workspace "$GITHUB_WORKSPACE/ios/FoodCheck.xcworkspace" \
            -scheme "FoodCheck" \
            -configuration Debug \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Locate FoodCheck.app
        shell: bash
        run: |
          set -e

          echo "Searching for generated .app..."

          find "$GITHUB_WORKSPACE/build/DerivedData" \
            -type d \
            -name "*.app" \
            -print

          APP_PATH=$(find \
            "$GITHUB_WORKSPACE/build/DerivedData" \
            -type d \
            -name "FoodCheck.app" \
            | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo ""
            echo "ERROR: FoodCheck.app was not found."
            echo ""
            find "$GITHUB_WORKSPACE/build/DerivedData" \
              -type d \
              -name "*.app" \
              -print
            exit 1
          fi

          echo ""
          echo "Found:"
          echo "$APP_PATH"

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Create development IPA
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/ipa"

          mkdir -p "$GITHUB_WORKSPACE/ipa/Payload"

          cp -R "$APP_PATH" \
            "$GITHUB_WORKSPACE/ipa/Payload/FoodCheck.app"

          cd "$GITHUB_WORKSPACE/ipa"

          zip -qry \
            "$GITHUB_WORKSPACE/FoodCheck-development.ipa" \
            Payload

          echo ""
          echo "IPA created:"
          ls -lh "$GITHUB_WORKSPACE/FoodCheck-development.ipa"

      - name: Verify IPA
        shell: bash
        run: |
          set -e

          test -f "$GITHUB_WORKSPACE/FoodCheck-development.ipa"

          echo "IPA:"
          ls -lh "$GITHUB_WORKSPACE/FoodCheck-development.ipa"

          echo ""
          echo "IPA contents:"
          unzip -l "$GITHUB_WORKSPACE/FoodCheck-development.ipa" | head -50

      - name: Upload development IPA
        uses: actions/upload-artifact@v7
        with:
          name: FoodCheck-iOS-Development
          path: FoodCheck-development.ipa
          if-no-files-found: error
name: FoodCheck iOS Release

on:
  workflow_dispatch:

jobs:
  build-ios-release:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Remove only the expo-dev-client config plugin from the CI copy.
      # The development project on the user's machine remains unchanged.
      - name: Prepare standalone Expo config
        run: |
          node <<'NODE'
          const fs = require('fs');

          const path = 'app.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          const expo = config.expo ?? {};

          if (Array.isArray(expo.plugins)) {
            expo.plugins = expo.plugins.filter((plugin) => {
              if (typeof plugin === 'string') {
                return plugin !== 'expo-dev-client';
              }

              if (Array.isArray(plugin)) {
                return plugin[0] !== 'expo-dev-client';
              }

              return true;
            });
          }

          config.expo = expo;
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');

          console.log('Standalone Expo config prepared.');
          NODE

      - name: Generate clean iOS native project
        env:
          CI: "1"
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        working-directory: ios
        run: pod install --repo-update

      # Release Xcode builds bundle JavaScript into the app.
      # FORCE_BUNDLING prevents reliance on a development server.
      - name: Build iOS Release (unsigned standalone)
        working-directory: ios
        env:
          FORCE_BUNDLING: "1"
        run: |
          set -e

          xcodebuild \
            -workspace FoodCheck.xcworkspace \
            -scheme FoodCheck \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Verify standalone bundle
        run: |
          set -e

          APP_PATH="$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "ERRORE: FoodCheck.app non trovata."
            exit 1
          fi

          echo "App trovata: $APP_PATH"

          if [ ! -f "$APP_PATH/main.jsbundle" ]; then
            echo "ERRORE: main.jsbundle non presente dentro FoodCheck.app"
            echo "La build non è standalone."
            exit 1
          fi

          echo "OK: main.jsbundle presente."
          ls -lh "$APP_PATH/main.jsbundle"

      - name: Package IPA
        run: |
          set -e

          APP_PATH="$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"

          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/

          rm -f FoodCheck-release-unsigned.ipa
          cd Payload
          zip -qry ../FoodCheck-release-unsigned.ipa "$(basename "$APP_PATH")"
          cd ..

          rm -rf Payload

          echo "IPA creata:"
          ls -lh FoodCheck-release-unsigned.ipa

      - name: Upload standalone IPA
        uses: actions/upload-artifact@v4
        with:
          name: FoodCheck-iOS-Standalone
          path: FoodCheck-release-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
